name: Fetch linphone-sdk
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run fetch script
        run: python3 fetch.py
      - name: Strip .git metadata to save space
        if: always()
        run: find linphone-sdk -name ".git" -exec rm -rf {} + 2>/dev/null || true
      - name: Zip result
        if: always()
        run: zip -r -q linphone-sdk.zip linphone-sdk report.txt
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linphone-sdk
          path: linphone-sdk.zip
          retention-days: 3
