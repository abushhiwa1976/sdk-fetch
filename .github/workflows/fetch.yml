name: Fetch linphone-sdk
on:
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone linphone-sdk (shallow, recursive)
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://gitlab.linphone.org/BC/public/linphone-sdk.git linphone-sdk
      - name: Strip .git metadata to save space
        run: |
          find linphone-sdk -name ".git" -exec rm -rf {} + 2>/dev/null || true
      - name: Zip result
        run: |
          zip -r -q linphone-sdk.zip linphone-sdk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linphone-sdk
          path: linphone-sdk.zip
          retention-days: 3
